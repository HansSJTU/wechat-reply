# Copy to secrets/stt_keys.toml (chmod 600; secrets/ is gitignored) and fill in what you have.
# Environment variables with the same names in upper case (see stt/keys.py) take precedence.

# Needed for the defaults: the [llm] chat bot (OpenAI) and [stt] provider = "combo" (local ASR, then
# DeepSeek turns it into Mandarin).
openai_api_key = ""
deepseek_api_key = ""

