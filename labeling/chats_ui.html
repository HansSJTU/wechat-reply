<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机器人会话</title>
<style>
:root {
  --bg: #ededed; --panel: #f7f7f7; --side: #e6e6e6; --line: #d6d6d6; --ink: #111; --muted: #888;
  --bubble: #fff; --mine: #95ec69; --on: #07c160; --off: #a0a0a0; --sel: #c9c9c9; --card: #fafafa;
  --warn: #c0392b; --chip: #eef6ff; --chip-ink: #1f5fa8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111; --panel: #191919; --side: #1f1f1f; --line: #2c2c2c; --ink: #e8e8e8; --muted: #8a8a8a;
    --bubble: #2c2c2c; --mine: #3eb575; --on: #2fbf71; --off: #666; --sel: #333; --card: #222;
    --warn: #e57373; --chip: #1d2b3a; --chip-ink: #8cb8ea; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
.app { display: flex; height: 100vh; }
aside { width: 280px; flex: none; background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; }
aside h1 { font-size: 15px; margin: 0; padding: 16px 14px 10px; display: flex; justify-content: space-between; }
aside h1 a { font-size: 12px; font-weight: normal; color: var(--muted); text-decoration: none; }
.chat { display: flex; gap: 10px; padding: 10px 14px; cursor: pointer; align-items: center; }
.chat:hover { background: rgba(0,0,0,.04); }
.chat.sel { background: var(--sel); }
.av { width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center; color: #fff;
  font-weight: 600; flex: none; font-size: 16px; }
.chat .mid { flex: 1; min-width: 0; }
.chat .top { display: flex; justify-content: space-between; gap: 6px; }
.chat .nm { font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.chat .tm { color: var(--muted); font-size: 11px; flex: none; }
.chat .pv { color: var(--muted); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 0 7px; border-radius: 9px;
  border: 1px solid currentColor; line-height: 17px; flex: none; }
.pill.on { color: var(--on); } .pill.off { color: var(--off); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--panel); }
header { padding: 12px 18px 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
header .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
header .t { font-size: 16px; font-weight: 600; }
header .sub { color: var(--muted); font-size: 12px; }
.strip { position: relative; height: 34px; margin: 10px 0 2px; }
.strip .bar { position: absolute; top: 6px; height: 8px; border-radius: 2px; }
.strip .tick { position: absolute; top: 2px; width: 2px; height: 16px; background: var(--ink); opacity: .55; }
.strip .ends { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between;
  font-size: 10px; color: var(--muted); }
.legend { font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.legend > span { white-space: nowrap; }
.legend i { display: inline-block; width: 10px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
#log { flex: 1; overflow-y: auto; padding: 14px 18px 30px; background: var(--bg); }
.tsep { text-align: center; color: var(--muted); font-size: 11px; margin: 14px 0 8px; }
.sw { display: flex; justify-content: center; margin: 14px 0; }
.sw span { font-size: 12px; padding: 3px 12px; border-radius: 12px; color: #fff; }
.sw.on span { background: var(--on); } .sw.off span { background: var(--off); }
.m { display: flex; gap: 8px; margin: 8px 0; align-items: flex-start; }
.m.right { flex-direction: row-reverse; }
.m .av { width: 34px; height: 34px; font-size: 13px; }
.m .body { max-width: min(70%, 620px); min-width: 0; }
.m.right .body { display: flex; flex-direction: column; align-items: flex-end; }
.m .who { font-size: 11px; color: var(--muted); margin: 0 2px 2px; }
.m.offp .bub { opacity: .75; }
.bub { background: var(--bubble); padding: 8px 11px; border-radius: 6px; word-break: break-word; white-space: pre-wrap; }
.m.right .bub { background: var(--mine); color: #111; }
.bub img { max-width: 220px; max-height: 260px; border-radius: 4px; display: block; }
.voice { cursor: pointer; display: flex; gap: 8px; align-items: center; user-select: none; min-width: 70px; }
.voice .ic { font-size: 12px; }
.voice.playing { outline: 2px solid var(--on); }
.stt { margin-top: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px;
  font-size: 12.5px; max-width: 620px; }
.stt .md { font-size: 13.5px; font-weight: 600; }
.stt .none { color: var(--muted); }
.stt .lab { margin-top: 4px; }
.stt .chip { font-size: 10.5px; padding: 0 6px; border-radius: 8px; background: var(--chip); color: var(--chip-ink);
  margin-right: 6px; }
.stt details { margin-top: 4px; }
.stt summary { cursor: pointer; color: var(--muted); font-size: 11.5px; }
.stt table { border-collapse: collapse; margin-top: 3px; }
.stt td { padding: 1px 8px 1px 0; vertical-align: top; }
.stt td:first-child { color: var(--muted); white-space: nowrap; font-size: 11.5px; }
.stt .err { color: var(--warn); }
.dec { margin-top: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
  font-size: 12px; width: 440px; max-width: 100%; }
.dec .hd { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.dec .v { font-size: 10.5px; padding: 0 6px; border-radius: 8px; color: #fff; background: var(--off); }
.dec .v.yes { background: var(--on); }
.dec .q { color: var(--muted); }
.dec .q b { color: var(--ink); font-weight: 500; }
.dec .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px 12px; margin-top: 5px; }
.dec .f { display: grid; grid-template-columns: auto 1fr auto; gap: 5px; align-items: center; opacity: .5; }
.dec .f.need { opacity: 1; font-weight: 500; }
.dec .f .bar { height: 5px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.dec .f .bar i { position: absolute; inset: 0 auto 0 0; background: var(--muted); }
.dec .f.need .bar i { background: var(--warn); }
.dec .f.need.ok .bar i { background: var(--on); }
.dec .f .n { font-variant-numeric: tabular-nums; font-size: 11px; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
@media (max-width: 720px) {
  .app { flex-direction: column; }
  aside { width: auto; height: auto; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
  #log { padding: 12px 16px 24px; }
  .m .body { max-width: 82%; }
  .dec .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>会话 <a href="/">标注页 →</a></h1>
    <div id="list"><div class="empty">加载中…</div></div>
  </aside>
  <main>
    <header id="head"><div class="sub">选一个会话</div></header>
    <div id="log"></div>
  </main>
</div>
<audio id="player"></audio>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const COLORS = ["#5b8def", "#e8833a", "#3fb27f", "#c35bd1", "#d65a5a", "#2aa3b8", "#8a7a3e", "#6a6fd8"];
const color = s => COLORS[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const initial = s => [...String(s || "?").replace(/[（(].*/, "")].slice(-1)[0] || "?";
const d = t => new Date(t * 1000);
const pad = n => String(n).padStart(2, "0");
const hm = t => `${pad(d(t).getHours())}:${pad(d(t).getMinutes())}`;
const day = t => `${d(t).getMonth() + 1}月${d(t).getDate()}日`;
const when = t => { const now = new Date(), x = d(t);
  return x.toDateString() === now.toDateString() ? hm(t) : `${x.getMonth() + 1}/${x.getDate()}`; };
let sel = (() => { try { return localStorage.getItem("chatsSel"); } catch { return null; } })();
let last = "";

async function loadList() {
  const r = await fetch("/api/chats").then(r => r.json());
  if (!sel && r.chats.length) sel = r.chats[0].chat;
  $("#list").innerHTML = r.chats.map(c => `
    <div class="chat ${c.chat === sel ? "sel" : ""}" data-c="${esc(c.chat)}">
      <div class="av" style="background:${color(c.name)}">${esc(initial(c.name))}</div>
      <div class="mid">
        <div class="top"><span class="nm">${esc(c.name)}</span><span class="tm">${when(c.last_time)}</span></div>
        <div class="top"><span class="pv">${esc(c.last_preview)}</span>
          <span class="pill ${c.on ? "on" : "off"}">${c.on ? "开启" : "关闭"}</span></div>
      </div>
    </div>`).join("") || '<div class="empty">还没有记录</div>';
  document.querySelectorAll(".chat").forEach(el => el.onclick = () => {
    sel = el.dataset.c; try { localStorage.setItem("chatsSel", sel); } catch {}
    last = ""; loadList(); loadChat(true);
  });
}

function strip(c) {
  const t0 = c.periods[0]?.from, t1 = Math.max(Date.now() / 1000, ...c.items.map(i => i.time));
  if (!t0 || t1 <= t0) return "";
  const x = t => ((t - t0) / (t1 - t0) * 100).toFixed(2) + "%";
  const bars = c.periods.map(p => `<div class="bar" style="left:${x(p.from)};width:calc(${x(p.to ?? t1)} - ${x(p.from)});
      background:var(--${p.on ? "on" : "off"})" title="${p.on ? "开启" : "关闭"}：${day(p.from)} ${hm(p.from)} → ${p.to ? day(p.to) + " " + hm(p.to) : "现在"}"></div>`).join("");
  const ticks = c.items.filter(i => i.kind === "switch").map(s =>
    `<div class="tick" style="left:${x(s.time)}" title="${esc(s.by)} ${s.on ? "开启" : "关闭"} · ${day(s.time)} ${hm(s.time)}"></div>`).join("");
  return `<div class="strip">${bars}${ticks}<div class="ends"><span>${day(t0)} ${hm(t0)}</span><span>现在</span></div></div>`;
}

function onAt(c, t) {
  const p = c.periods.find(p => t >= p.from && (p.to == null || t < p.to));
  return p ? p.on : c.on;
}

function sttCard(i, c) {
  const names = {"volc-file-2": "火山", "deepseek": "DeepSeek", "openai": "OpenAI", "whisper-ft": "whisper-ft",
    "wu-ft": "wu-ft"};
  let top;
  if (i.mandarin) top = `<div class="md">${esc(i.mandarin)}</div>`;
  else if (i.stt_error) top = `<div class="err">识别失败：${esc(i.stt_error)}</div>`;
  else top = `<div class="none">机器人没有转写这条（${onAt(c, i.time) ? "当时群里还不转写语音（改版前）" : "当时是关闭的"}）</div>`;
  const lab = i.label && i.label.status === "done"
    ? `<div class="lab"><span class="chip">已标注</span>${esc(i.label.wu)}${i.label.meaning ? `<span style="color:var(--muted)"> · ${esc(i.label.meaning)}</span>` : ""}</div>`
    : `<div class="lab"><span class="chip">待标注</span></div>`;
  const cand = Object.entries(i.candidates || {});
  const local = ["whisper-ft", "wu-ft"].filter(k => i.local?.[k] != null && !(k in (i.candidates || {})))
    .map(k => [k, i.local[k]]);
  const rows = [...cand, ...local].map(([k, v]) =>
    `<tr><td>${esc(names[k] || k)}${cand.some(c => c[0] === k) ? "" : "（本地草稿）"}</td><td>${esc(v)}</td></tr>`).join("");
  return `<div class="stt">${top}${lab}${rows ? `<details><summary>各识别器的结果（${cand.length + local.length}）</summary><table>${rows}</table></details>` : ""}</div>`;
}

const TO = {bot: "跟机器人说", member: "跟某人说", group: "对全群", none: "自言自语/表态"};
const KIND = {question: "问问题", share: "分享", chat: "闲聊", other: "其他"};
const FACT = {needs_response: "要回应", answerable: "能答准", share_to_group: "在分享", can_comment: "能接话", unanswered: "没人接",
  hot_topic: "聊时事"};
const RULE = {bot: "跟它说话", question: "答问题", share: "接分享", topic: "聊时事"};
const f2 = x => x == null ? "–" : Number(x).toFixed(2);

function decCard(dc, c) {
  const spoke = dc.reply && !dc.skipped;
  const verdict = spoke ? "开口" : dc.reply ? "想开口，没说" : "不开口";
  const why = dc.skipped && dc.skipped !== "judge: no" ? ` · ${esc(dc.skipped)}` : "";
  const th = k => Math.max(c.fact_thresholds[k] ?? c.threshold, dc.voice ? c.voice_threshold : 0);
  const rule = dc.need.length ? `${dc.rule ? `按「${RULE[dc.rule] || dc.rule}」` : ""}最弱 ${f2(dc.p)} / 阈值 ${f2(dc.th ?? c.threshold)}`
    : "这类不主动说";
  const facts = Object.entries(FACT).filter(([k]) => k in dc.facts).map(([k, lab]) => {
    const v = dc.facts[k], need = dc.need.includes(k);
    return `<div class="f ${need ? "need" : ""} ${need && v >= th(k) ? "ok" : ""}" title="${k} · 阈值 ${f2(th(k))}${need ? "（这次要看的）" : ""}">
      <span>${lab}</span><span class="bar"><i style="width:${Math.round((v || 0) * 100)}%"></i></span><span class="n">${f2(v)}</span></div>`;
  }).join("");
  return `<div class="dec" title="${esc(dc.reason || "")}">
    <div class="hd"><span class="v ${spoke ? "yes" : ""}">${verdict}</span>
      <span class="q">对象 <b>${esc(TO[dc.to] || dc.to)}</b> ${f2(dc.conf.to)}</span>
      <span class="q">类型 <b>${esc(KIND[dc.kind] || dc.kind)}</b> ${f2(dc.conf.kind)}</span>
      ${dc.voice ? `<span class="q">全是语音，阈值至少 ${f2(c.voice_threshold)}</span>` : ""}
      <span class="q">${rule}${why}${dc.n > 1 ? ` · 合判 ${dc.n} 条` : ""}</span></div>
    <div class="facts">${facts}</div></div>`;
}

function msg(i, c) {
  const right = i.bot || i.self;
  const who = i.bot ? (c.bot_name || "机器人") : i.self ? "本账号（手动）" : i.sender;
  let inner;
  if (i.type === "voice") {
    const w = Math.min(260, 70 + (i.seconds || 0) * 6);
    inner = `<div class="bub voice" data-key="${esc(i.key)}" style="width:${w}px"><span class="ic">▶</span>${i.seconds || ""}″</div>${sttCard(i, c)}`;
  } else if (i.type === "image" && i.image) {
    inner = `<div class="bub"><img loading="lazy" src="/media/${encodeURIComponent(i.image)}" alt="图片"></div>`;
  } else {
    inner = `<div class="bub">${esc(i.text ?? `[${i.type}]`)}</div>`;
  }
  if (i.decision) inner += decCard(i.decision, c);
  const off = !i.bot && !i.self && !onAt(c, i.time);
  return `<div class="m ${right ? "right" : ""} ${off ? "offp" : ""}">
    <div class="av" style="background:${right ? "#888" : color(who)}">${esc(initial(who))}</div>
    <div class="body">${c.is_group || i.bot || i.self ? `<div class="who">${esc(who)}</div>` : ""}${inner}</div></div>`;
}

async function loadChat(scroll) {
  if (!sel) return;
  const c = await fetch("/api/chat?c=" + encodeURIComponent(sel)).then(r => r.json());
  const sig = JSON.stringify([c.on, c.items.length, c.items.filter(i => i.mandarin || i.label).length,
    c.items.filter(i => i.decision).length, c.items.filter(i => i.decision?.skipped).length]);
  if (sig === last && !scroll) return;
  last = sig;
  const bot = c.bot_name || "机器人";
  const lastSw = [...c.items].reverse().find(i => i.kind === "switch");
  const modeDesc = c.is_group
    ? (c.group_auto ? `群：@${esc(bot)} 必回，也会酌情主动插话` : `群：@${esc(bot)} 才回复`)
    : "私聊：每条都回复";
  $("#head").innerHTML = `<div class="row"><span class="t">${esc(c.name)}</span>
      <span class="pill ${c.on ? "on" : "off"}">${c.on ? "开启" : "关闭"}</span>
      <span class="sub">${modeDesc} · 发${c.is_group ? `「@${esc(bot)} 开启/关闭」` : "「开启/关闭」"}切换
      ${lastSw ? ` · 最近一次切换：${day(lastSw.time)} ${hm(lastSw.time)}，${esc(lastSw.by.replace(/[（）]/g, ""))}${lastSw.on ? "开启" : "关闭"}` : ""}</span></div>
    ${strip(c)}
    <div class="legend"><span><i style="background:var(--on)"></i>开启：语音转文字、会回复</span><span><i style="background:var(--off)"></i>关闭：只记录</span><span>竖线：切换</span>
      ${c.is_group ? `<span>判断卡：<i style="background:var(--on)"></i>达标 <i style="background:var(--warn)"></i>没达标 <i style="background:var(--muted);opacity:.5"></i>这类不看</span>` : ""}</div>`;
  const log = $("#log"), atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  let html = "", prev = 0;
  for (const i of c.items) {
    if (i.time - prev > 300) html += `<div class="tsep">${day(i.time)} ${hm(i.time)}</div>`;
    prev = i.time;
    html += i.kind === "switch"
      ? `<div class="sw ${i.on ? "on" : "off"}"><span>${esc(i.by)} ${i.on ? "开启" : "关闭"}了机器人 · ${hm(i.time)}</span></div>`
      : msg(i, c);
  }
  log.innerHTML = html || '<div class="empty">没有消息</div>';
  log.querySelectorAll(".voice").forEach(el => el.onclick = () => play(el));
  if (scroll || atBottom) {  // stay at the newest message, also while images load and grow the list
    log.scrollTop = log.scrollHeight;
    log.querySelectorAll("img").forEach(img => img.addEventListener("load", () => { log.scrollTop = log.scrollHeight; }));
  }
}

function play(el) {
  const p = $("#player");
  document.querySelectorAll(".voice.playing").forEach(x => x.classList.remove("playing"));
  if (p.dataset.key === el.dataset.key && !p.paused) { p.pause(); return; }
  p.src = "/audio/" + encodeURIComponent(el.dataset.key); p.dataset.key = el.dataset.key;
  el.classList.add("playing"); p.play();
  p.onended = () => el.classList.remove("playing");
}

loadList().then(() => loadChat(true));
setInterval(() => { loadList(); loadChat(false); }, 10000);
</script>
</body>
</html>
